# EuRoC MAV Dataset — Camera Calibration
# Source: ASL Dataset Format (cam0, stereo left)
#
# Usage: these values should be passed to the VO system at startup.

camera:
  model: pinhole
  width: 752
  height: 480
  fx: 458.654
  fy: 457.296
  cx: 367.215
  cy: 248.375
  distortion: [ -0.28340811, 0.07395907, 0.00019359, 1.76187114e-05 ]

# VO parameters
vo:
  max_features: 2000
  ratio_threshold: 0.8
  ransac_threshold: 1.0
  ransac_confidence: 0.999
  min_matches: 30
  min_inliers: 20
  keyframe_interval: 5
  max_reproj_error: 3.0
  depth_factor: 10.0          # max_depth = median_depth * depth_factor
